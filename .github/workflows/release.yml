name: Release

# Tag a commit v<version> and push the tag; this builds the same two artefacts
# tools\build.ps1 builds locally and attaches them to a GitHub release.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag has to match <Version> in Directory.Build.props - the job checks and fails
# loudly rather than shipping a setup exe whose file name lies about its contents.
#
# Optional secret:
#   VT_API_KEY - a free VirusTotal API key. Set it and both artefacts are scanned, with
#                an analysis link per file in the release notes. Absent, the scan is
#                skipped, the notes say so, and nothing else about the release changes.
#                This buys a sceptical downloader a second opinion on two unsigned
#                binaries; it does nothing about SmartScreen, which needs a certificate.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      # Read in the VirusTotal step's `if:` below. A fork or a repo without the secret
      # set gets an empty string here and skips the scan, rather than failing the build
      # over a nice-to-have.
      VT_API_KEY: ${{ secrets.VT_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check the tag against Directory.Build.props
        id: version
        shell: pwsh
        run: |
          $props = Get-Content Directory.Build.props -Raw
          if ($props -notmatch '<Version>([^<]+)</Version>') { throw 'No <Version> in Directory.Build.props' }
          $version = $Matches[1].Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tagVersion -ne $version) {
              throw "Tag $env:GITHUB_REF_NAME says $tagVersion, Directory.Build.props says $version. Bump one of them."
            }
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Per-user install, no admin, same command the README gives contributors.
      # ISCC lands in %LOCALAPPDATA%\Programs\Inno Setup 6, which build.ps1 looks in.
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $exe -UseBasicParsing
          $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/CURRENTUSER','/NORESTART','/SUPPRESSMSGBOXES' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed (exit $($p.ExitCode))" }

      # Publishes dist\app, downloads and hash-verifies PawnIO_setup.exe, compiles the
      # installer, packs the portable zip.
      - name: Build
        shell: pwsh
        run: .\tools\build.ps1 -Clean -Installer -Zip

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: halo-${{ steps.version.outputs.version }}
          path: |
            dist/Halo-Setup-${{ steps.version.outputs.version }}.exe
            dist/Halo-${{ steps.version.outputs.version }}-win-x64.zip
          if-no-files-found: error

      # After the upload on purpose: the scan takes a couple of minutes and can hang on a
      # VirusTotal outage, and the artefacts should already be safe by then.
      #
      # Both files are well over VirusTotal's 32 MB direct-upload limit (~56 MB installer,
      # ~77 MB zip, measured on 1.0.3), so the action fetches a one-shot URL from /files/upload_url first and
      # POSTs there instead - two HTTP requests per file, against a public-API budget of
      # 4 requests/minute and 500/day (https://docs.virustotal.com/reference/public-vs-premium-api).
      # request_rate throttles per *file*, not per request, so it is 2 here and not 4.
      #
      # Forward slashes in `files:` are load-bearing even though this is a Windows runner:
      # the action resolves them with node-glob, which reads a backslash as an escape.
      - name: Scan with VirusTotal
        id: vt
        if: env.VT_API_KEY != ''
        continue-on-error: true      # a VirusTotal outage must not sink a finished release
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            dist/Halo-Setup-${{ steps.version.outputs.version }}.exe
            dist/Halo-${{ steps.version.outputs.version }}-win-x64.zip
          request_rate: 2
          # The release does not exist yet when this runs, so there is no body to append
          # to; the links are read off this step's output in the next step instead.
          update_release_body: false

      - name: Create the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          # Single-quoted here-string: nothing in here is escaped or interpolated, so the
          # markdown backticks survive. VERSION is substituted afterwards.
          # Same layout as the MacTime and MonitorScreenSaver releases: the "## Key changes"
          # section goes above this by hand on the release page once the release exists, since
          # nothing here can know what changed.
          # Plain ASCII only ('-' and '->', never an em dash or an arrow glyph): the runner writes
          # this block to a script file, and non-ASCII text there is an encoding risk for no gain.
          $notes = @'
          ## Install

          1. Download `Halo-Setup-VERSION.exe` for the installer, or `Halo-VERSION-win-x64.zip` for the portable version.
          2. Open the installer and approve the UAC prompt. SmartScreen may appear because Halo is not code signed. **More info -> Run anyway** allows it to open. Windows 11 Smart App Control may block unsigned apps.
          3. PawnIO and Start with Windows are selected by default. PawnIO is what CPU temperatures, fan speeds and drive temperatures need.

          Installing over an earlier version upgrades it in place and keeps existing settings and layouts. The portable version keeps its settings and logs in a `data` folder beside the programs, and starts by running `Halo.Collector.exe` as administrator, then `Halo.Widgets.exe`.

          Requires Windows 10 1809 or later, or Windows 11, on x64.
          '@
          $lines = @($notes -replace 'VERSION', $v)

          # The VirusTotal section is appended after the substitution above, never written
          # into the here-string: -replace is a global regex, and any new text containing
          # the word VERSION would be rewritten along with it. $tick spells a backtick
          # without fighting PowerShell's escape character inside an interpolated string.
          $tick = '`'
          $lines += ''

          # steps.vt.outputs.analysis is "<path>=<url>" pairs, comma separated, and empty
          # when the scan was skipped (no VT_API_KEY) or failed (continue-on-error). The
          # action echoes back the path it was given, not a bare asset name - hence
          # Split-Path.
          $vt = '${{ steps.vt.outputs.analysis }}'
          if ($vt) {
            $lines += '## VirusTotal'
            $lines += ''
            foreach ($pair in $vt -split ',') {
              $name, $url = $pair -split '=', 2
              $lines += "- [$tick$(Split-Path $name -Leaf)$tick]($url)"
            }
            $lines += ''
            # Measured on 1.0.3: 1/68 on the installer and 1/66 on the zip, the lone hit
            # being one ML engine returning a bare "MALICIOUS" with no family name. The
            # bundled PawnIO_setup.exe is 0/70 on its own, so it is not the driver.
            $lines += 'A single unnamed detection from one machine-learning engine is expected. These'
            $lines += 'are new, unsigned programs that include a ~175 MB .NET runtime, and automated'
            $lines += 'scanners are often suspicious of that combination. The major engines report'
            $lines += 'both files as clean. Several engines agreeing on a named threat would be a'
            $lines += 'different matter, and a GitHub issue about it would be appreciated.'
          } else {
            $lines += '**VirusTotal** - no analysis is available for this release.'
          }

          ($lines -join "`n") | Out-File release-notes.md -Encoding utf8
          gh release create $env:GITHUB_REF_NAME "dist/Halo-Setup-$v.exe" "dist/Halo-$v-win-x64.zip" --title "Halo $v" --notes-file release-notes.md
